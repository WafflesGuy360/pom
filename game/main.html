<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GOD IS COMING</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:"Courier New",monospace;color:#c33;user-select:none}
  canvas{width:100vw;height:100vh;display:block;position:fixed;inset:0}
  #vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 22%,#000c 70%,#000 100%)}
  #red{position:fixed;inset:0;pointer-events:none;background:#a00;opacity:0;mix-blend-mode:multiply}
  #txt{position:fixed;inset:0;pointer-events:none;overflow:hidden}
  #txt span{position:absolute;white-space:nowrap;font-weight:bold;color:#e22;text-shadow:2px 0 #0ff,-2px 0 #f0f,0 0 12px #f00;will-change:transform}
  #menu{position:fixed;inset:0;background:#000d;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;z-index:5;padding:20px}
  #timer{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:16px;font-size:18px;color:#d11;z-index:3;pointer-events:none;text-shadow:0 0 6px #600;letter-spacing:.08em}
  #arrow{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:calc(50% - 18px);font-size:28px;font-weight:bold;color:#2f4;opacity:.3;z-index:3;pointer-events:none;text-shadow:0 0 10px #0f3;display:none;letter-spacing:-2px}
  #msg{position:fixed;top:18%;left:0;right:0;text-align:center;font-size:clamp(20px,4vw,40px);color:#2f4;text-shadow:0 0 12px #0f3;z-index:3;pointer-events:none;opacity:0;letter-spacing:.08em}
  #black{position:fixed;inset:0;background:#000;display:none;z-index:4}
  #scare{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;display:none;z-index:3;pointer-events:none}
  #menu h1{font-size:clamp(28px,7vw,72px);letter-spacing:.2em;margin:0 0 20px;color:#d22;text-shadow:0 0 18px #500}
  #menu p{color:#999;max-width:540px;line-height:1.6;margin:6px}
  #diff{display:flex;flex-direction:column;gap:12px;margin-top:28px;width:100%;max-width:320px}
  #diff button{background:#1a0808;border:1px solid #a22;color:#e55;font-family:"Courier New",monospace;font-size:18px;padding:12px 24px;cursor:pointer;letter-spacing:.12em;transition:background .15s,border-color .15s,color .15s}
  #diff button:hover{background:#2a1010;border-color:#f33;color:#f88}
  #diff button .t{display:block;font-size:12px;color:#866;margin-top:4px;letter-spacing:.06em}
  #hint{position:fixed;left:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));font-size:12px;color:#555;pointer-events:none}
  #hud{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:16px;font-size:16px;color:#8c8;z-index:3;pointer-events:none;text-shadow:0 0 8px #060;letter-spacing:.06em}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="vig"></div><div id="red"></div><div id="txt"></div><div id="black"></div><img id="scare" alt="" src="sounds/scary.jpg"><div id="timer"></div><div id="arrow">→</div><div id="msg"></div><div id="hud"></div>
<div id="hint">WASD move · Shift run · mouse / ←→ look · collect 10 papers</div>
<div id="menu"><h1 id="mt">GOD IS COMING</h1>
  <p id="ms">Find all 10 papers hidden in the maze before the time runs out.<br>When the timer ends, something unseen arrives.<br>You can’t see it. You’ll know.</p>
  <div id="diff">
    <button data-limit="420000">EASY<span class="t">7 minutes</span></button>
    <button data-limit="300000">NORMAL<span class="t">5 minutes</span></button>
    <button data-limit="180000">HARD<span class="t">3 minutes</span></button>
  </div>
</div>

<script>
// ---------- config ----------
const AUDIO_SRC = "sounds/god_is_coming.mp3";
const N = 41;                 // maze size (odd)
let LIMIT = 300000;           // set by difficulty
const PAPER_COUNT = 10;
const PHRASES = ["HE IS HERE","RUN","HE SEES YOU","DON'T LOOK BACK","BEHIND YOU","GOD IS COMING",
  "HE IS CLOSE","DON'T STOP","HE KNOWS","IT'S WATCHING","LEAVE","HE HAS ARRIVED","CAN YOU HEAR HIM","RUN RUN RUN","I SEE YOU","HE IS INSIDE","LOOK UP","TOO LATE","HE IS HERE HE IS HERE","DO NOT TURN AROUND"];
const rnd=a=>a[Math.random()*a.length|0], R=(a,b)=>a+Math.random()*(b-a);
const hs=n=>{n=Math.sin(n*12.9898)*43758.5453;return n-Math.floor(n)};

// ---------- maze ----------
let map,px,py,pa,entity,spawnAt,t0,deadline,state="menu",dist=null,bob=0,burstAt=0,lf=1,dipUntil=0;
let papers=[], lights=[], collected=0;
function carve(){
  map=Array.from({length:N},()=>Array(N).fill(1));
  const st=[[1,1]]; map[1][1]=0;
  while(st.length){
    const [x,y]=st[st.length-1];
    const d=[[2,0],[-2,0],[0,2],[0,-2]].sort(()=>Math.random()-.5)
      .filter(([a,b])=>x+a>0&&y+b>0&&x+a<N-1&&y+b<N-1&&map[y+b][x+a]);
    if(!d.length){st.pop();continue}
    const [a,b]=d[0]; map[y+b/2][x+a/2]=0; map[y+b][x+a]=0; st.push([x+a,y+b]);
  }
  for(let i=0;i<90;i++){const x=1+Math.floor(Math.random()*(N-2)),y=1+Math.floor(Math.random()*(N-2));
    if(map[y][x]&&((!map[y][x-1]&&!map[y][x+1])||(!map[y-1][x]&&!map[y+1][x])))map[y][x]=0}
}
function bfsFrom(sx,sy){
  const d=Array.from({length:N},()=>Array(N).fill(-1)), q=[[sx,sy]]; d[sy][sx]=0;
  for(let i=0;i<q.length;i++){const [x,y]=q[i];
    for(const [a,b] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+a,ny=y+b;
      if(map[ny]&&map[ny][nx]===0&&d[ny][nx]<0){d[ny][nx]=d[y][x]+1;q.push([nx,ny])}}}
  return d;
}
function genMaze(){
  carve();
}
function placeItems(){
  const opens=[];
  for(let y=1;y<N-1;y++)for(let x=1;x<N-1;x++){
    if(map[y][x]===0 && !(x<=2 && y<=2)) opens.push([x,y]);
  }
  // shuffle
  for(let i=opens.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [opens[i],opens[j]]=[opens[j],opens[i]];
  }
  papers = opens.slice(0, PAPER_COUNT).map(([x,y])=>({x:x+0.5, y:y+0.5, collected:false}));
  // lights: more of them, on open cells
  lights = opens.slice(PAPER_COUNT, PAPER_COUNT+22).map(([x,y])=>({x:x+0.5, y:y+0.5}));
  collected = 0;
}
function start(limitMs){
  LIMIT = limitMs || 300000;
  genMaze(); placeItems();
  px=1.5;py=1.5;pa=0.3; entity=null; bob=0; burstAt=0;
  t0=performance.now(); deadline=t0+LIMIT; spawnAt=deadline; state="play";
  document.getElementById("menu").style.display="none";
  document.getElementById("black").style.display="none"; stopSound(); scare.style.display="none";
  document.getElementById("arrow").style.display="block";
  const mg=document.getElementById("msg"); mg.textContent="Find the papers";
  mg.style.transition="none"; mg.style.opacity=1; void mg.offsetWidth;
  mg.style.transition="opacity 5s linear"; mg.style.opacity=0;
  document.getElementById("txt").innerHTML=""; spans.length=0;
  ambience(true);
  updateHud();
}

// ---------- textures ----------
function makeTex(bad){
  const S=256,c=document.createElement("canvas");c.width=c.height=S;const g=c.getContext("2d");
  // base mortar color
  g.fillStyle=bad?"#2a0a0c":"#3a2826";
  g.fillRect(0,0,S,S);

  // clean red brick pattern (no scratches, no stains)
  const brickH=32, brickW=64;
  for(let row=0;row<8;row++){
    const offset=(row%2)?32:0;
    for(let col=-1;col<5;col++){
      const x=col*brickW+offset;
      const y=row*brickH;
      // slight per-brick variation for realism
      const v=R(-18,12);
      g.fillStyle=bad
        ?`rgb(${90+v|0},${12+v*0.3|0},${16+v*0.2|0})`
        :`rgb(${140+v|0},${48+v*0.4|0},${42+v*0.3|0})`;
      g.fillRect(x+1,y+1,brickW-2,brickH-2);
      // subtle bevel
      g.fillStyle=bad?"rgba(255,80,80,0.08)":"rgba(255,180,160,0.12)";
      g.fillRect(x+1,y+1,brickW-2,3);
      g.fillStyle="rgba(0,0,0,0.18)";
      g.fillRect(x+1,y+brickH-4,brickW-2,3);
    }
  }

  // only a couple of words, nothing else
  if(!bad){
    const words=["RUN","HE IS HERE","LEAVE","TOO LATE"];
    g.save();
    g.font='bold 22px "Courier New",monospace';
    g.fillStyle="rgba(30,8,8,0.75)";
    g.fillText(rnd(words), R(20,90), R(50,100));
    g.fillStyle="rgba(25,6,6,0.65)";
    g.fillText(rnd(words), R(40,140), R(160,220));
    g.restore();
  }else{
    // corrupted version still mostly brick, just a little bloodier + one phrase
    g.fillStyle="rgba(180,10,20,0.25)";
    g.fillRect(0,0,S,S);
    g.font='bold 20px "Courier New",monospace';
    g.fillStyle="rgba(220,30,30,0.8)";
    g.fillText(rnd(["HE SEES YOU","GOD IS COMING"]), R(15,80), R(80,180));
  }

  // very light grain only
  for(let i=0;i<800;i++){
    const v=R(0,40)|0;
    g.fillStyle=`rgba(${v},${v},${v},0.04)`;
    g.fillRect(R(0,S),R(0,S),1,1);
  }
  return c;
}

// ---------- canvas / input ----------
const cv=document.getElementById("c"), ctx=cv.getContext("2d");
let W,H,T0,T1,grain;
function resize(){const s=Math.min(1,960/innerWidth);W=Math.round(innerWidth*s);H=Math.round(innerHeight*s);cv.width=W;cv.height=H}
addEventListener("resize",resize); resize();
T0=makeTex(0); T1=makeTex(1);
{const g=document.createElement("canvas");g.width=g.height=160;const x=g.getContext("2d"),im=x.createImageData(160,160);
 for(let i=0;i<im.data.length;i+=4){const v=Math.random()*255;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=255}
 x.putImageData(im,0,0);grain=ctx.createPattern(g,"repeat")}
const keys={}, scare=document.getElementById("scare"); let scareOk=true; scare.onerror=()=>{scareOk=false};
addEventListener("keydown",e=>{keys[e.code]=1;if(e.code.startsWith("Arrow"))e.preventDefault()});
addEventListener("keyup",e=>keys[e.code]=0);
addEventListener("mousemove",e=>{if(document.pointerLockElement===cv&&state==="play")pa+=e.movementX*0.0025});
document.getElementById("diff").onclick=e=>{
  const btn=e.target.closest("button");
  if(!btn)return;
  const limit=parseInt(btn.dataset.limit,10);
  try{cv.requestPointerLock()}catch(_){}
  prepAudio(); start(limit);
};

// ---------- audio ----------
let aud=null, fallback=null, actx=null, amb=null, fbOn=false;
function ctxA(){if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)()}catch(_){}}if(actx&&actx.resume)actx.resume();return actx}
function ambience(on){ // low dread drone under everything
  const a=ctxA(); if(!a)return;
  if(!amb){const g=a.createGain();g.gain.value=0;g.connect(a.destination);
    [41,43.1,82.4,123.9].forEach((f,i)=>{const o=a.createOscillator();o.type=i>1?"triangle":"sine";o.frequency.value=f;
      const l=a.createGain();l.gain.value=i>1?.25:1;o.connect(l);l.connect(g);o.start()});amb=g}
  amb.gain.value=on?.11:0;
}
function thump(v){
  const a=actx; if(!a)return; const o=a.createOscillator(),g=a.createGain();
  o.frequency.value=46;g.gain.setValueAtTime(v,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.2);
  o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.22);
}
function collectSound(){
  const a=ctxA(); if(!a)return;
  const o=a.createOscillator(), g=a.createGain();
  o.type="sine"; o.frequency.setValueAtTime(880,a.currentTime); o.frequency.exponentialRampToValueAtTime(440,a.currentTime+.15);
  g.gain.setValueAtTime(.25,a.currentTime); g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.18);
  o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime+.2);
}
function prepAudio(){
  if(aud)return;
  aud=new Audio(AUDIO_SRC); aud.loop=false; aud.volume=1; aud.preload="auto";
  aud.onerror=()=>{aud=null};
}
function makeFallback(){
  try{
    const a=ctxA(); const g=a.createGain(); g.gain.value=0; g.connect(a.destination);
    [55,58,110.7].forEach(f=>{const o=a.createOscillator();o.type="sawtooth";o.frequency.value=f;o.connect(g);o.start()});
    fallback=g;
  }catch(_){}
}
function startSound(){
  if(aud){aud.loop=false;aud.currentTime=0;aud.volume=.12;aud.onended=blackout;aud.play().catch(fbSound)}
  else fbSound();
}
function fbSound(){ // drone stand-in (20s) if the mp3 can't load
  if(fbOn)return; fbOn=true;
  if(!fallback)makeFallback();
  if(fallback)fallback.gain.value=.15;
  setTimeout(()=>{if(entity&&state==="play")blackout()},20000);
}
function stopSound(){
  if(aud){aud.onended=null;aud.pause();aud.currentTime=0}
  if(fallback)fallback.gain.value=0; fbOn=false;
}
function blackout(){
  if(state!=="play")return;
  state="black"; entity=null; stopSound(); ambience(false); scare.style.display="none";
  txt.innerHTML=""; spans.length=0; document.getElementById("arrow").style.display="none";
  document.getElementById("black").style.display="block";
  if(document.pointerLockElement)document.exitPointerLock();
  setTimeout(()=>{
    mt.textContent="You failed";
    ms.innerHTML="Something found you.<br>Choose a difficulty and try again.";
    document.getElementById("menu").style.display="flex";
  },3500);
}

// ---------- corrupted text ----------
const txt=document.getElementById("txt"), spans=[];
const LEET={E:"3",O:"0",I:"1",A:"4",S:"5",T:"7",H:"#",G:"6"};
const JUNK="▓▒░█#@%&?¥§Ж҉Ω∆Ψ¿¡╬";
const ZAL=["\u0300","\u0301","\u0306","\u0315","\u0316","\u0322","\u0334","\u0336","\u0338","\u035b"];
const FW=t=>[...t].map(c=>c>" "&&c<"\x7f"?String.fromCharCode(c.charCodeAt(0)+0xFEE0):c).join("");
const FLIP={a:"ɐ",e:"ǝ",h:"ɥ",r:"ɹ",u:"n",n:"u",m:"ɯ",t:"ʇ",y:"ʎ",d:"p",b:"q",w:"ʍ",i:"ᴉ",c:"ɔ",g:"ƃ",k:"ʞ"};
const BLK="█▓▒░▌▐▀▄■□◢◣◤◥", RUNE="ᚠᚢᚦᚨᚱᚲᛉᛟ҈҉҂Ѫѫ☠♱✝";
const zal=n=>{let z="";for(let i=0;i<n;i++)z+=rnd(ZAL);return z};
function corrupt2(s,p){
  const m=Math.random();
  if(m<.07)return [...Array(8+(Math.random()*20|0))].map(()=>Math.random()<.5?"1":"0").join("");
  if(m<.12)return "ERR_0x"+(Math.random()*0xFFFFFF|0).toString(16).toUpperCase()+" "+rnd(PHRASES);
  if(m<.17)return [...s].reverse().join("");
  if(m<.22)return FW(s);
  let o="";
  for(const ch of s){
    const r=Math.random(),l=ch.toLowerCase();
    if(ch===" "){o+=Math.random()<p*.5?rnd(BLK):" ";continue}
    if(r<p*.18)o+=LEET[ch.toUpperCase()]||rnd(JUNK);
    else if(r<p*.3)o+=rnd(JUNK+BLK+RUNE);
    else if(r<p*.38)continue;
    else if(r<p*.46)o+=ch+ch+ch;
    else if(r<p*.54)o+=FLIP[l]||ch;
    else o+=Math.random()<.5?l:ch.toUpperCase();
    if(Math.random()<p*.8)o+=zal(1+(Math.random()*(3+p*10)|0));
  }
  if(Math.random()<p*.4)o+=" "+rnd(BLK).repeat(2+(Math.random()*6|0));
  return o;
}
function makeSpan(){
  const s=document.createElement("span"); txt.appendChild(s);
  const o={el:s,next:0,x:0,y:0,sz:20,base:PHRASES[0]};
  spans.push(o); return o;
}
const SW={o:"0",O:"0",l:"1",L:"1",i:"1",I:"1",e:"3",E:"3",a:"4",A:"4",s:"5",S:"5",t:"7",T:"7",g:"9",b:"8"};
function varyText(base,p){
  const ch=[...base], n=1+(Math.random()*(1+p*3)|0);
  for(let j=0;j<n;j++){
    const i=Math.random()*ch.length|0, c=ch[i]; if(c===" ")continue;
    const r=Math.random();
    ch[i]=r<.5&&SW[c]?SW[c]:r<.72?(c===c.toUpperCase()?c.toLowerCase():c.toUpperCase()):r<.88?rnd(JUNK):c;
  }
  return ch.join("");
}
const FLK=[["#000","0 0 3px #fff,0 0 1px #fff"],["#fff","0 0 4px #fff"],["#1a3cff","0 0 5px #15f"],["#f10","0 0 5px #f00"]];
function updateText(now,k,pr){
  const g=Math.min(1,pr+k*.1);   // text intensity follows the sound's progress
  const ts=entity?(now-entity.born)/1000:0, fi=Math.max(0,Math.min(1,(ts-5)/4)), want=entity&&ts>5?Math.max(1,Math.round((2+g*20)*fi)):0;
  while(spans.length<want){
    const o=makeSpan(), st=o.el.style;
    o.x=Math.random()*85; o.y=Math.random()*92; o.sz=16+Math.random()*(20+g*70); o.base=rnd(PHRASES);
    st.left=o.x+"%"; st.top=o.y+"%"; st.fontSize=o.sz+"px"; st.transform="none";
  }
  spans.forEach((o,i)=>{
    if(i>=want){o.el.style.display="none";return}
    o.el.style.display="block";
    if(Math.random()<.08+g*g*.92){const fc=FLK[Math.random()*4|0]; o.el.style.color=fc[0]; o.el.style.textShadow=fc[1]}
    if(Math.random()<g*g*.3+g*.008){
      o.x=Math.random()*85; o.y=Math.random()*92;
      o.el.style.left=o.x+"%"; o.el.style.top=o.y+"%";
    }
    let amp=.4+g*3+g*g*30; if(Math.random()<g*g*.08)amp*=3;
    const rz=g*g*16;
    o.el.style.transform=`translate(${(Math.random()-.5)*amp*2}px,${(Math.random()-.5)*amp*2}px) rotate(${(Math.random()-.5)*rz}deg) scale(${1+(Math.random()-.5)*g*g*.9})`;
    if(now>o.next){
      if(Math.random()<.03)o.base=rnd(PHRASES);
      o.el.textContent=Math.random()<g*g*.55?corrupt2(o.base,.25+g*.7):varyText(o.base,g*1.6);
      o.el.style.opacity=(.7+Math.random()*.3)*(.3+.7*fi);
      o.next=now+(70+Math.random()*130)*(1-g*.82);
    }
  });
}

// ---------- entity (invisible) ----------
function bfs(){dist=bfsFrom(px|0,py|0)}
function spawnEntity(){
  bfs();
  const cells=[];
  for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(dist[y][x]>=9&&dist[y][x]<=16)cells.push([x,y]);
  const c=cells.length?rnd(cells):[N-2,N-2];
  entity={x:c[0]+.5,y:c[1]+.5,born:performance.now(),speed:2.0};
  burstAt=entity.born;
  startSound();
}
function stepEntity(dt){
  const cx=entity.x|0, cy=entity.y|0; let best=null, bd=dist[cy][cx];
  for(const [a,b] of [[1,0],[-1,0],[0,1],[0,-1]]){
    const nx=cx+a,ny=cy+b;
    if(map[ny]&&map[ny][nx]===0&&dist[ny][nx]>=0&&dist[ny][nx]<bd){bd=dist[ny][nx];best=[nx+.5,ny+.5]}
  }
  const tx=best?best[0]:px, ty=best?best[1]:py;
  const dx=tx-entity.x, dy=ty-entity.y, l=Math.hypot(dx,dy)||1, s=Math.min(l,entity.speed*dt);
  entity.x+=dx/l*s; entity.y+=dy/l*s;
}

// ---------- render ----------
function cast(a){
  const dx=Math.cos(a),dy=Math.sin(a);
  let mx=px|0,my=py|0;
  const ddx=Math.abs(1/dx),ddy=Math.abs(1/dy);
  let sx,sy,sdx,sdy;
  if(dx<0){sx=-1;sdx=(px-mx)*ddx}else{sx=1;sdx=(mx+1-px)*ddx}
  if(dy<0){sy=-1;sdy=(py-my)*ddy}else{sy=1;sdy=(my+1-py)*ddy}
  let side=0;
  for(let i=0;i<120;i++){
    if(sdx<sdy){sdx+=ddx;mx+=sx;side=0}else{sdy+=ddy;my+=sy;side=1}
    if(map[my][mx])break;
  }
  const d=side===0?sdx-ddx:sdy-ddy;
  return {d,side,hit:side===0?py+d*dy:px+d*dx};
}
const FOV=Math.PI/2, TF=Math.tan(FOV/2), arrow=document.getElementById("arrow");
function drawPapers(now,F,cy){
  // sort by distance (far first) so near ones draw on top
  const list = papers.filter(p=>!p.collected).map(p=>{
    const ex=p.x-px, ey=p.y-py, ed=Math.hypot(ex,ey);
    return {p,ex,ey,ed};
  }).filter(o=>o.ed<18).sort((a,b)=>b.ed-a.ed);

  for(const {p,ex,ey,ed} of list){
    let ang=Math.atan2(ey,ex)-pa;
    while(ang>Math.PI)ang-=2*Math.PI; while(ang<-Math.PI)ang+=2*Math.PI;
    if(Math.abs(ang)>=FOV/2+0.05) continue;
    if(cast(pa+ang).d < ed-0.25) continue;

    const sx=(.5+Math.tan(ang)/(2*TF))*W;
    const scale = F * 0.38 / ed;
    const pw = scale * 0.55;
    const ph = scale * 0.75;
    const top = cy - ph*0.55 + Math.sin(now/400 + p.x*3)*2;

    // soft glow
    ctx.globalCompositeOperation="lighter";
    const gr=ctx.createRadialGradient(sx,cy,0,sx,cy,scale*1.1);
    gr.addColorStop(0,"rgba(255,240,180,.35)");
    gr.addColorStop(1,"rgba(255,220,100,0)");
    ctx.fillStyle=gr;
    ctx.fillRect(sx-scale*1.2, cy-scale*1.2, scale*2.4, scale*2.4);
    ctx.globalCompositeOperation="source-over";

    // paper body
    ctx.fillStyle="#e6dfc8";
    ctx.fillRect(sx-pw/2, top, pw, ph);
    // border
    ctx.strokeStyle="#8a8070";
    ctx.lineWidth=Math.max(1, scale*0.04);
    ctx.strokeRect(sx-pw/2, top, pw, ph);
    // text lines
    ctx.strokeStyle="#5a5040";
    ctx.lineWidth=Math.max(0.8, scale*0.025);
    for(let i=0;i<5;i++){
      const ly = top + ph*0.18 + i*(ph*0.14);
      const inset = pw*0.12 + (i%2?pw*0.05:0);
      ctx.beginPath();
      ctx.moveTo(sx-pw/2+inset, ly);
      ctx.lineTo(sx+pw/2-inset, ly);
      ctx.stroke();
    }
    // small fold corner
    ctx.fillStyle="#cfc6b0";
    ctx.beginPath();
    ctx.moveTo(sx+pw/2, top);
    ctx.lineTo(sx+pw/2, top+ph*0.18);
    ctx.lineTo(sx+pw/2-pw*0.18, top);
    ctx.fill();
  }
}
function drawCeilingLights(now,F,cy){
  // small white rectangular ceiling lights
  for(const L of lights){
    const ex=L.x-px, ey=L.y-py, ed=Math.hypot(ex,ey);
    if(ed>14) continue;
    let ang=Math.atan2(ey,ex)-pa;
    while(ang>Math.PI)ang-=2*Math.PI; while(ang<-Math.PI)ang+=2*Math.PI;
    if(Math.abs(ang)>=FOV/2+0.12) continue;
    if(cast(pa+ang).d < ed-0.35) continue;

    const sx=(.5+Math.tan(ang)/(2*TF))*W;
    const scale = F * 0.18 / Math.max(ed,0.7);
    const flicker = 0.9 + 0.1*Math.sin(now/220 + L.x*3);

    // simple small white rectangle fixture
    const w = scale * 0.9;
    const h = scale * 0.28;
    const y = cy - scale * 1.6;

    ctx.globalCompositeOperation="lighter";
    // soft glow around the rectangle
    const g=ctx.createRadialGradient(sx, y, 0, sx, y, scale*1.4);
    g.addColorStop(0,`rgba(255,255,255,${0.35*flicker})`);
    g.addColorStop(1,"rgba(255,255,255,0)");
    ctx.fillStyle=g;
    ctx.fillRect(sx-scale*1.5, y-scale, scale*3, scale*2);

    // the actual white rectangle
    ctx.fillStyle=`rgba(255,255,255,${0.92*flicker})`;
    ctx.fillRect(sx-w/2, y-h/2, w, h);
    ctx.globalCompositeOperation="source-over";
  }
}
function render(now,k,cr,pr){
  const S=W/480, F=W/(2*TF), shake=cr*(6+cr*26)*S/2.6+k*3*S;
  // flickering flashlight: random dips, worse once he is here
  if(now>dipUntil&&Math.random()<.008+cr*.05)dipUntil=now+R(40,180);
  lf=now<dipUntil?R(.15,.4):.9+.1*Math.sin(now/170+Math.sin(now/53));
  ctx.setTransform(1,0,0,1,0,0);
  ctx.translate(W/2,H/2);ctx.rotate((Math.random()-.5)*cr*cr*.07);
  ctx.translate(-W/2+(Math.random()-.5)*shake*2,-H/2+(Math.random()-.5)*shake*1.4+Math.sin(bob)*2.5*S);
  // ceiling
  let g=ctx.createLinearGradient(0,0,0,H/2);
  g.addColorStop(0,"#020202");g.addColorStop(0.6,"#0a0908");g.addColorStop(1,"#0e0c0a");
  ctx.fillStyle=g;ctx.fillRect(-W,-H,3*W,H*1.5);
  // floor
  g=ctx.createLinearGradient(0,H/2,0,H);g.addColorStop(0,"#050404");g.addColorStop(1,"#1d1612");
  ctx.fillStyle=g;ctx.fillRect(-W,H/2,3*W,H*1.5);
  const bs=48*S/2.6, ts=now/180|0, jit=(Math.random()-.5)*cr*.03;
  const FLC=["#000","#fff","#1a3cff","#f10"];
  const gs=now/60|0, gcol=cr>0&&hs(gs*7.7)<cr*.3?FLC[hs(gs*3.1)*4|0]:null, fs=now/40|0;

  // precompute nearby lights for wall lighting
  const nearLights = lights.filter(L => Math.hypot(L.x-px, L.y-py) < 11);

  for(let x=0;x<W;x+=COL){
    const sx=(x+COL/2)/W*2-1, off=Math.atan(sx*TF), a=pa+off+jit;
    const r=cast(a), d=Math.max(.05,r.d*Math.cos(off));
    let h=Math.min(H*4,F*.8/d), yo=0, tex=T0;
    let u=((r.hit%1)+1)%1*256, tint=null, flash=null;
    let b=Math.exp(-r.d*.36)*(r.side?.62:1)*(.38+.62*(1-sx*sx*.9))*lf*1.5;

    // ceiling light contribution on walls
    const hitX = px + Math.cos(a)*r.d;
    const hitY = py + Math.sin(a)*r.d;
    for(const L of nearLights){
      const ld = Math.hypot(L.x-hitX, L.y-hitY);
      if(ld < 7){
        const contrib = (1 - ld/7) * 0.55 * (0.85 + 0.15*Math.sin(now/200 + L.x));
        b = Math.min(1.35, b + contrib);
      }
    }

    if(cr>0){
      const blk=hs((x/bs|0)+ts*131);
      yo=Math.sin(x*.03/S+now/110)*cr*14*S/2.6;
      h*=1+Math.sin(now/380+x*.012)*cr*.07;
      if(blk<cr*.7){tex=T1;u=(u+hs(x+ts)*256+now/12)%256}
      if(Math.random()<cr*.1){h*=1+(Math.random()-.5)*cr;yo+=(Math.random()-.5)*70*cr*S/2.6}
      if(Math.random()<cr*cr*.2)tint=Math.random()<.5?"rgba(0,255,255,.5)":"rgba(255,0,190,.5)";
      if(gcol||hs((x/bs|0)*17+fs*53)<cr*.5)flash=gcol||FLC[hs(x+fs)*4|0];
      if(blk>.9&&cr>.5){b=Math.min(1,b+.6)}
    }
    const top=(H-h)/2+yo;
    const sw=Math.max(.5,Math.min(256-u,COL*256*d/F));ctx.drawImage(tex,u,0,sw,256,x,top,COL,h);
    if(tint){ctx.fillStyle=tint;ctx.fillRect(x,top,COL,h)}
    b=Math.min(1,b);
    if(b<.99){ctx.fillStyle=`rgba(0,0,0,${1-b})`;ctx.fillRect(x,top,COL,h)}
    if(flash){ctx.globalAlpha=.88;ctx.fillStyle=flash;ctx.fillRect(x,top,COL,h);ctx.globalAlpha=1}
  }

  // draw ceiling lights and papers after walls
  drawCeilingLights(now,F,H/2);
  drawPapers(now,F,H/2);

  ctx.setTransform(1,0,0,1,0,0);
  // warm flashlight bloom
  ctx.globalCompositeOperation="lighter";
  g=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,W*.5);
  g.addColorStop(0,`rgba(255,205,130,${.1*lf})`);g.addColorStop(1,"rgba(255,205,130,0)");
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.globalCompositeOperation="source-over";

  if(cr>0){
    const n=(cr>.25&&Math.random()<cr*.5?1:0)+(cr*5*Math.random()|0);
    for(let i=0;i<n;i++){const y=Math.random()*H,hh=(3+Math.random()*(20+cr*50))*S/2.6,o=(Math.random()-.5)*(70*cr+90*cr*cr)*S/2.6;
      ctx.drawImage(cv,0,y,W,hh,o,y,W,hh)}
    if(Math.random()<.5){ctx.globalAlpha=cr*.3;ctx.drawImage(cv,Math.round((2+cr*9)*S/2.6),0);ctx.globalAlpha=1}
    if(Math.random()<cr*cr*.05){ctx.fillStyle=Math.random()<.5?"#fff":"#f00";ctx.fillRect(0,0,W,H)}
  }
  cv.style.filter=0?`contrast(${1+cr*.5}) saturate(${1+cr*1.6})${Math.random()<pr*.3?` hue-rotate(${Math.random()*360|0}deg)`:""}`:"none";
}

// ---------- loop ----------
let last=performance.now(), nextBfs=0, nextBeat=0, COL=4, ema=.016;
const redEl=document.getElementById("red"), mt=document.getElementById("mt"), ms=document.getElementById("ms"), tm=document.getElementById("timer"), hud=document.getElementById("hud");
function updateHud(){
  hud.textContent = `PAPERS  ${collected}/${PAPER_COUNT}`;
}
function endGame(msg,title){
  state="over"; stopSound(); ambience(false); entity=null; scare.style.display="none"; txt.innerHTML=""; spans.length=0;
  mt.textContent=title; ms.innerHTML=msg; arrow.style.display="none";
  document.getElementById("menu").style.display="flex";
  redEl.style.opacity=0; if(document.pointerLockElement)document.exitPointerLock();
}
function loop(now){
  const dt=Math.min(.05,(now-last)/1000); last=now;
  ema+=(dt-ema)*.05; if(ema>.026&&COL<10){COL+=2;ema=.02}else if(ema<.0175&&COL>4&&Math.random()<.01)COL-=2;
  let k=0, pr=0, cr=0;
  if(state==="play"){
    if(keys.ArrowLeft)pa-=2.2*dt; if(keys.ArrowRight)pa+=2.2*dt;
    const fw=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0);
    const st=(keys.KeyD?1:0)-(keys.KeyA?1:0), run=keys.ShiftLeft||keys.ShiftRight;
    const sp=(run?4.6:3.3)*dt, c=Math.cos(pa), s=Math.sin(pa);
    const mx=(c*fw-s*st)*sp, my=(s*fw+c*st)*sp, m=.22;
    if(!map[py|0][(px+mx+Math.sign(mx)*m)|0])px+=mx;
    if(!map[(py+my+Math.sign(my)*m)|0][px|0])py+=my;
    if(fw||st)bob+=dt*(run?14:10);

    // collect papers
    for(const p of papers){
      if(!p.collected && Math.hypot(p.x-px, p.y-py) < 0.55){
        p.collected = true;
        collected++;
        collectSound();
        updateHud();
        if(collected >= PAPER_COUNT){
          endGame("You gathered every scrap.<br>For now.<br>Choose a difficulty to play again.","YOU ESCAPED");
          return;
        }
      }
    }

    // point arrow at nearest uncollected paper
    let nearest=null, nd=1e9;
    for(const p of papers){
      if(p.collected) continue;
      const d=Math.hypot(p.x-px,p.y-py);
      if(d<nd){nd=d;nearest=p}
    }
    if(nearest){
      let ang=Math.atan2(nearest.y-py, nearest.x-px)-pa;
      while(ang>Math.PI)ang-=2*Math.PI; while(ang<-Math.PI)ang+=2*Math.PI;
      // → points right by default; subtract π/2 so ang=0 (ahead) points up
      arrow.style.transform=`rotate(${ang - Math.PI/2}rad)`;
      arrow.style.opacity = 0.35 + 0.45*(1-Math.min(1,nd/12));
    }

    if(!entity&&now>spawnAt)spawnEntity();
    if(entity){
      if(now>nextBfs){bfs();nextBfs=now+300}
      stepEntity(dt); entity.speed=Math.min(2.5,entity.speed+dt*.02);
      const d=Math.hypot(entity.x-px,entity.y-py);
      k=Math.max(0,Math.min(1,1-d/12)); k=Math.max(k,.2);
      if(d<.6)k=1;
      pr=(aud&&aud.duration>0&&isFinite(aud.duration))?aud.currentTime/aud.duration:Math.min(1,(now-entity.born)/20000);
      pr=Math.max(0,Math.min(1,pr));
      const vol=Math.min(1,.12+(now-entity.born)/5000*.88);
      if(aud)aud.volume=vol; if(fbOn&&fallback)fallback.gain.value=.15*vol;
      const rem=(aud&&aud.duration>0&&isFinite(aud.duration))?aud.duration-aud.currentTime:20-(now-entity.born)/1000;
      if(scareOk&&rem<.2){scare.style.display="block";
        scare.style.transform=`translate(${(Math.random()-.5)*30}px,${(Math.random()-.5)*30}px) scale(${1.05+Math.random()*.1})`;
        scare.style.filter=Math.random()<.25?"invert(1)":Math.random()<.2?"contrast(2) saturate(3)":"none"}
      const burst=Math.max(0,1-(now-burstAt)/3200);
      cr=Math.min(1,Math.max(.55,pr,burst,k*.8));
    }
    if(!entity){const l2=(deadline-now)/1000;if(l2<8)cr=(1-l2/8)*.3}
    // heartbeat
    if(now>nextBeat){
      thump(.5+k*.5);setTimeout(()=>thump(.32+k*.4),150);
      const left=(deadline-now)/1000;
      nextBeat=now+1150*Math.max(.3,1-k*.5-(left<15?.25:0)-(entity?.12:0));
    }
  }
  if(map)render(now,k,cr,pr);
  if(state==="play"){
    const r=Math.max(0,Math.ceil((deadline-now)/1000));
    const mm=(r/60|0), ss=String(r%60).padStart(2,"0");
    tm.textContent=entity?"he is here":mm+":"+ss;
    tm.style.opacity=r<=15?(.5+.5*Math.sin(now/90)):1;
  }else tm.textContent="";
  redEl.style.opacity=entity&&state==="play"?(Math.max(k,cr*.6)*.55*(.6+.4*Math.sin(now/90))):0;
  updateText(now,k,pr);
  requestAnimationFrame(loop);
}
genMaze(); placeItems(); px=1.5;py=1.5;pa=.3;
requestAnimationFrame(loop);
</script>
